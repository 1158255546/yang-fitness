# Optional: on a Mac with XcodeGen installed, run `xcodegen generate`
# then open RestTimer.xcodeproj and configure Signing & Capabilities.
name: RestTimer
options:
  bundleIdPrefix: com.yangfitness
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  RestTimer:
    type: application
    platform: iOS
    sources:
      - path: RestTimer/iOS
      - path: RestTimer/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yangfitness.RestTimer
      INFOPLIST_KEY_CFBundleDisplayName: RestTimer
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: RestTimerWatch
        embed: true
  RestTimerWatch:
    type: application
    platform: watchOS
    sources:
      - path: RestTimer/watchOS
      - path: RestTimer/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yangfitness.RestTimer.watchkitapp
      INFOPLIST_KEY_CFBundleDisplayName: RestTimer
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yangfitness.RestTimer
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
    dependencies: []
schemes:
  RestTimer:
    build:
      targets:
        RestTimer: all
        RestTimerWatch: all
    run:
      config: Debug
